name: rocky_calculator_pro
description: A feature-rich Pro Calculator with AI, Voice, and Financial tools.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Math Parsing
  math_expressions: ^2.5.0
  
  # UI & Design
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  flutter_animate: ^4.5.0
  
  # Services & Data
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  
  # Voice Recognition
  speech_to_text: ^6.6.1
  
  # AI Support (Optional: for natural language processing)
  # You can use google_generative_ai if you have an API key
  # For now, we will build a local NLP logic.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Add your assets here if you have custom icons
  # assets:
  #   - assets/icons/
